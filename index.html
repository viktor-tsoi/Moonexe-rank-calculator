<style>
#gate{position:fixed;inset:0;display:grid;place-items:center;background:#003EFD;color:#fff;font:15px/1.5 Poppins,system-ui,sans-serif;padding:24px}
#gate *{box-sizing:border-box}
#gate .in{width:100%;max-width:360px;text-align:center}
#gate svg{width:180px;height:auto;fill:#fff;margin-bottom:18px}
#gate h1{font-size:20px;font-weight:600;margin:0 0 4px}
#gate p{margin:0 0 18px;opacity:.85;font-size:13px}
#gate form{display:grid;gap:10px}
#gate input{font:600 22px Poppins,sans-serif;text-align:center;letter-spacing:.08em;text-transform:uppercase;padding:12px;border-radius:12px;border:0;width:100%;color:#0a1033}
#gate button{font:600 16px Poppins,sans-serif;padding:12px;border-radius:12px;border:2px solid #fff;background:transparent;color:#fff;cursor:pointer;min-height:48px}
#gate button:disabled{opacity:.6}
#gate .msg{min-height:44px;margin-top:14px;font-size:13px;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;display:none}
#gate .msg.show{display:block}
#gate small{display:block;margin-top:18px;opacity:.7;font-size:11px}
.mx-out{display:block;text-align:center;font:12px Poppins,sans-serif;color:#5a6488;margin:6px 0 20px;background:none;border:0;cursor:pointer;width:100%}
</style>

    <p>Dành riêng cho team MoonExe · Internal use only</p>
    <form id="gf">
      <label for="gc" style="position:absolute;left:-9999px">Mã truy cập</label>
      <input id="gc" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" maxlength="12">
      <button id="gb" type="submit">Vào công cụ</button>
    </form>
    <div class="msg" id="gm" role="status"></div>
    <small>Nhập mã một lần, máy sẽ nhớ. Cần có mạng mỗi lần mở.</small>
  </div>
</div>
<script>
{
const API=window.MOONEXE_API||'';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let dev=store.get('mx_dev');
if(!dev){dev=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));store.set('mx_dev',dev)}
const ua=navigator.userAgent;
const label=(/iPhone/.test(ua)?'iPhone':/iPad/.test(ua)?'iPad':/Android/.test(ua)?'Android':/Windows/.test(ua)?'Windows':/Mac/.test(ua)?'Mac':/Linux/.test(ua)?'Linux':'Thiết bị khác')+' · '+(/Edg\//.test(ua)?'Edge':/CriOS|Chrome\//.test(ua)?'Chrome':/Safari\//.test(ua)?'Safari':/Firefox|FxiOS/.test(ua)?'Firefox':'Trình duyệt khác');
const MSG={off:'Công cụ đang tạm khóa. Vui lòng liên hệ Viktor.',code:'Mã không đúng hoặc đã bị khóa.',devices:'Mã này đã được dùng trên 2 thiết bị. Nhờ Viktor xóa bớt thiết bị rồi thử lại.',bad:'Vui lòng nhập mã truy cập.',net:'Không kết nối được. Cần có mạng để mở công cụ — kiểm tra kết nối rồi thử lại.',cfg:'Chưa cấu hình địa chỉ máy chủ (config.js).'};
const $=id=>document.getElementById(id);
function say(k){const m=$('gm');m.textContent=MSG[k]||MSG.net;m.classList.add('show')}
function busy(b){$('gb').disabled=b;$('gb').textContent=b?'Đang kiểm tra…':'Vào công cụ'}
function mount(html){
  const box=document.createElement('div');box.id='mx-app';box.innerHTML=html;
  const scripts=[...box.querySelectorAll('script')];scripts.forEach(s=>s.remove());
  $('gate').remove();document.body.prepend(box);
  scripts.forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;document.body.appendChild(n)});
  const out=document.createElement('button');out.className='mx-out';out.type='button';out.textContent='Đổi mã truy cập';
  out.onclick=()=>{store.del('mx_code');location.reload()};document.body.appendChild(out);
}
async function check(code){
  if(!API||API.indexOf('http')!==0){say('cfg');return}
  busy(true);
  try{
    const r=await fetch(API,{method:'POST',body:JSON.stringify({code,dev,label})});
    const j=await r.json();
    if(j.ok&&j.app){store.set('mx_code',code);mount(j.app);return}
    if(j.reason==='code'||j.reason==='devices')store.del('mx_code');
    $('gc').value=code;say(j.reason);
  }catch(e){$('gc').value=code;say('net')}
  busy(false);
}
$('gf').onsubmit=e=>{e.preventDefault();const c=$('gc').value.trim().toUpperCase();if(!c){say('bad');return}check(c)};
const saved=store.get('mx_code');
if(saved)check(saved);else $('gc').focus();
}
</script>
